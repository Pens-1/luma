services:
  # ==================================================
  # 共有インフラ
  # ==================================================
  
  # 共有PostgreSQL（n8n, Dify, FastAPI用）
  postgres:
    image: postgres:16-alpine
    container_name: luma-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis（Dify/Celery用）
  redis:
    image: redis:7-alpine
    container_name: luma-redis
    restart: unless-stopped
    command: redis-server --requirepass redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Weaviate（Dify RAG用ベクトルDB）
  weaviate:
    image: semitechnologies/weaviate:1.19.0
    container_name: luma-weaviate
    restart: unless-stopped
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - CLUSTER_HOSTNAME=node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================================
  # n8n
  # ==================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: schedule-optimizer-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # 基本設定
      - N8N_SECURE_COOKIE=false
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Tokyo}
      - TZ=${GENERIC_TIMEZONE:-Asia/Tokyo}
      
      # PostgreSQL データベース設定
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres_password
      
      # データ永続化設定
      - N8N_USER_FOLDER=/home/node/.n8n
      
      # Webhook設定（ローカル開発用）
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      
      # 環境変数アクセス許可（セキュリティ設定）
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      
      # Google Gemini API設定（環境変数経由でn8nから参照可能）
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
      
      # Slack Webhook URL（環境変数経由でn8nから参照可能）
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      
      # Discord Webhook URL（環境変数経由でn8nから参照可能）
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      
      # Notion API設定（環境変数経由でn8nから参照可能）
      - NOTION_API_SECRET=${NOTION_API_SECRET}
      - NOTION_TODO_DATABASE_ID=${NOTION_TODO_DATABASE_ID}
    
    depends_on:
      postgres:
        condition: service_healthy
    
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/backup/workflows:ro
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==================================================
  # FastAPI（OR-Tools最適化API）
  # ==================================================
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luma-fastapi
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/fastapi
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==================================================
  # Dify
  # ==================================================
  
  # Dify API サーバー
  dify-api:
    image: langgenius/dify-api:latest
    container_name: luma-dify-api
    restart: unless-stopped
    environment:
      - MODE=api
      - LOG_LEVEL=INFO
      - SECRET_KEY=${DIFY_SECRET_KEY:-sk-9f73s3ljTXVcMT3Blb3ljTqtsKiGHXVcMT3BlbkFJLK7U}
      - INIT_PASSWORD=${DIFY_INIT_PASSWORD:-}
      - MIGRATION_ENABLED=true
      # PostgreSQL設定
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres_password
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=dify
      # Redis設定
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_password
      - CELERY_BROKER_URL=redis://:redis_password@redis:6379/1
      # Weaviate設定
      - VECTOR_STORE=weaviate
      - WEAVIATE_ENDPOINT=http://weaviate:8080
      - WEAVIATE_API_KEY=
      # ストレージ設定
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/storage
      # Sandbox設定（コード実行用）
      - CODE_EXECUTION_ENDPOINT=http://dify-sandbox:8194
      - CODE_EXECUTION_API_KEY=dify-sandbox-key
      # Plugin Daemon設定
      - PLUGIN_DAEMON_URL=http://dify-plugin-daemon:5002
      - PLUGIN_DAEMON_KEY=dify-plugin-key
      - INNER_API_KEY=${DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI}
    volumes:
      - dify_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy

  # Dify Worker（Celery）
  dify-worker:
    image: langgenius/dify-api:latest
    container_name: luma-dify-worker
    restart: unless-stopped
    environment:
      - MODE=worker
      - LOG_LEVEL=INFO
      - SECRET_KEY=${DIFY_SECRET_KEY:-sk-9f73s3ljTXVcMT3Blb3ljTqtsKiGHXVcMT3BlbkFJLK7U}
      # PostgreSQL設定
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres_password
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=dify
      # Redis設定
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_password
      - CELERY_BROKER_URL=redis://:redis_password@redis:6379/1
      # Weaviate設定
      - VECTOR_STORE=weaviate
      - WEAVIATE_ENDPOINT=http://weaviate:8080
      - WEAVIATE_API_KEY=
      # ストレージ設定
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/storage
      # Sandbox設定（コード実行用）
      - CODE_EXECUTION_ENDPOINT=http://dify-sandbox:8194
      - CODE_EXECUTION_API_KEY=dify-sandbox-key
    volumes:
      - dify_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dify Web フロントエンド
  dify-web:
    image: langgenius/dify-web:latest
    container_name: luma-dify-web
    restart: unless-stopped
    environment:
      - CONSOLE_API_URL=
      - APP_API_URL=
    depends_on:
      - dify-api

  # Dify Nginx（リバースプロキシ）
  dify-nginx:
    image: nginx:alpine
    container_name: luma-dify-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./dify/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dify/nginx/proxy.conf:/etc/nginx/proxy.conf:ro
    depends_on:
      - dify-api
      - dify-web

  # Dify Plugin Daemon（プラグイン管理用）
  dify-plugin-daemon:
    image: langgenius/dify-plugin-daemon:0.5.1-local
    container_name: luma-dify-plugin-daemon
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres_password
      - DB_DATABASE=dify_plugin
      - SERVER_PORT=5002
      - SERVER_KEY=dify-plugin-key
      - MAX_PLUGIN_PACKAGE_SIZE=52428800
      - PPROF_ENABLED=false
      - DIFY_INNER_API_URL=http://dify-api:5001
      - DIFY_INNER_API_KEY=${DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI}
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/storage
      - PLUGIN_WORKING_PATH=/app/storage/cwd
      - PLUGIN_INSTALLED_PATH=plugin
      - PLUGIN_PACKAGE_CACHE_PATH=plugin_packages
      - PLUGIN_MEDIA_CACHE_PATH=assets
      - MARKETPLACE_ENABLED=true
      - MARKETPLACE_API_URL=https://marketplace.dify.ai
      - PLUGIN_REMOTE_INSTALLING_HOST=https://marketplace.dify.ai
      - PLUGIN_REMOTE_INSTALLING_PORT=443
      - PLUGIN_REMOTE_INSTALLING_ENABLED=true
      - FORCE_VERIFYING_SIGNATURE=true
      - PLUGIN_PYTHON_ENV_INIT_TIMEOUT=120
      - PLUGIN_MAX_EXECUTION_TIMEOUT=600
      # Redis設定
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_password
    volumes:
      - dify_plugin_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dify Sandbox（コード実行用）
  dify-sandbox:
    image: langgenius/dify-sandbox:latest
    container_name: luma-dify-sandbox
    restart: unless-stopped
    environment:
      - API_KEY=dify-sandbox-key
      - GIN_MODE=release
      - WORKER_TIMEOUT=15
      - ENABLE_NETWORK=true
      - HTTP_PROXY=http://dify-ssrf-proxy:3128
      - HTTPS_PROXY=http://dify-ssrf-proxy:3128
      - SANDBOX_PORT=8194
    volumes:
      - dify_sandbox_dependencies:/dependencies
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SSRF Proxy（セキュリティ用）
  dify-ssrf-proxy:
    image: ubuntu/squid:latest
    container_name: luma-dify-ssrf-proxy
    restart: unless-stopped
    volumes:
      - ./dify/ssrf/squid.conf:/etc/squid/squid.conf:ro

# ==================================================
# ボリューム
# ==================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  weaviate_data:
    driver: local
  n8n_data:
    driver: local
  dify_storage:
    driver: local
  dify_sandbox_dependencies:
    driver: local
  dify_plugin_storage:
    driver: local

