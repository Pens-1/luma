services:
  # ==================================================
  # 共有インフラ
  # ==================================================
  
  redis:
    image: redis:7-alpine
    container_name: luma-redis
    restart: unless-stopped
    command: redis-server --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================================
  # LUMA マイクロサービス群
  # 既存のlucid_solomonコンテナ（Ollama）を使用
  # ==================================================
  # ==================================================

  luma-discord-bot:
    build: ./services/discord_bot
    container_name: luma-discord-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://:redis_password@redis:6379
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      redis:
        condition: service_healthy

  luma-fast-service:
    build: ./services/fast_service
    container_name: luma-fast-service
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://:redis_password@redis:6379
      - OLLAMA_URL=http://lucid_solomon:11434
      - NOTION_API_KEY=${NOTION_API_KEY}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
    volumes:
      - ./shared:/app/shared:ro
      - ./services/fast_service/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default

  luma-evaluator-service:
    build: ./services/evaluator_service
    container_name: luma-evaluator-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    env_file: .env
    environment:
      - REDIS_URL=redis://:redis_password@redis:6379
      - OLLAMA_URL=http://lucid_solomon:11434
    volumes:
      - ./shared:/app/shared:ro
      - ./services/evaluator_service/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default

  luma-aider-service:
    build: ./services/aider_service
    container_name: luma-aider-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file: .env
    environment:
      - REDIS_URL=redis://:redis_password@redis:6379
      - OLLAMA_URL=http://lucid_solomon:11434
      - OLLAMA_API_BASE=http://lucid_solomon:11434
    volumes:
      - ./shared:/app/shared:ro
      - ./services/fast_service:/workspace:rw  # Aider修正対象
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default

volumes:
  redis_data:
    driver: local
  ollama_data:
    external: true
